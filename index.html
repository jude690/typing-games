<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FAT: Premiere Matchmaking</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        :root {
            --cs-orange: #ff9a00; --cs-bg: #0b0c0f; --cs-panel: #16191d;
            --cs-border: #2d3238; --cs-text: #8b929a; --cs-white: #ffffff;
            --cs-ct: #4b92db; --cs-t: #de9b35; --cs-green: #5eb75e;
        }
        body {
            background-color: var(--cs-bg); color: var(--cs-text); font-family: 'Segoe UI', sans-serif;
            margin: 0; padding: 0; height: 100vh; display: flex; flex-direction: column; text-transform: uppercase;
            background-image: linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.7)), url('https://www.transparenttextures.com/patterns/carbon-fibre.png');
        }

        /* Top Bar */
        .navbar {
            background: #000; border-bottom: 1px solid var(--cs-border);
            display: flex; align-items: center; padding: 0 40px; height: 60px; justify-content: space-between;
        }
        .nav-group { display: flex; gap: 30px; height: 100%; }
        .nav-item { 
            display: flex; align-items: center; cursor: pointer; color: var(--cs-text); 
            font-weight: 800; font-size: 13px; border-bottom: 3px solid transparent; transition: 0.2s;
        }
        .nav-item:hover, .nav-item.active { color: var(--cs-white); border-bottom: 3px solid var(--cs-orange); }

        .app-container { flex: 1; display: flex; flex-direction: column; align-items: center; padding: 40px 20px; }
        .tab-view { display: none; width: 100%; max-width: 550px; flex-direction: column; }
        .tab-view.active { display: flex; }

        /* Panels */
        .panel { background: var(--cs-panel); border: 1px solid var(--cs-border); padding: 25px; box-shadow: 0 20px 40px rgba(0,0,0,0.6); }
        .panel-header { font-size: 18px; color: var(--cs-white); margin-bottom: 20px; font-weight: 900; letter-spacing: 1px; }

        /* Inputs */
        .cs-input { 
            width: 100%; background: #000; border: 1px solid var(--cs-border); padding: 15px; 
            color: #fff; margin-bottom: 15px; font-family: monospace; box-sizing: border-box; outline: none;
        }
        .cs-input:focus { border-color: var(--cs-orange); }

        .btn-prime { 
            background: var(--cs-orange); color: #000; border: none; width: 100%; 
            padding: 15px; font-weight: 900; cursor: pointer; transition: 0.1s;
        }
        .btn-prime:hover { filter: brightness(1.2); }
        .btn-prime:active { transform: scale(0.98); }

        /* Shop Grid */
        .shop-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .item-card { 
            background: #111418; border: 1px solid var(--cs-border); padding: 15px; 
            text-align: center; display: flex; flex-direction: column;
        }
        .item-price { color: var(--cs-green); font-family: monospace; margin: 10px 0; font-weight: bold; }

        /* Game UI */
        #scoreboard { 
            display: none; width: 100%; background: rgba(0,0,0,0.9); 
            border: 1px solid var(--cs-border); padding: 15px; margin-bottom: 20px;
        }
        .score-row { display: flex; justify-content: space-between; align-items: center; font-size: 32px; font-weight: 900; }
        .timer { color: var(--cs-orange); font-family: monospace; font-size: 24px; }

        .console {
            background: #000; border-top: 1px solid var(--cs-border); color: #00ff00;
            font-family: monospace; font-size: 11px; height: 80px; padding: 10px; overflow-y: auto;
        }
    </style>
</head>
<body>

    <div class="navbar">
        <div class="nav-group">
            <div class="nav-item active" onclick="showTab('play', this)">PLAY</div>
            <div class="nav-item" onclick="showTab('shop', this)">SHOP</div>
        </div>
        <div style="display: flex; gap: 20px; align-items: center;">
            <div id="status-light" style="width:10px; height:10px; background:red; border-radius:50%;"></div>
            <div style="color:var(--cs-green); font-weight:900;">$ <span id="wallet">0</span></div>
        </div>
    </div>

    <div class="app-container">
        
        <div id="scoreboard" class="panel">
            <div class="score-row">
                <div style="color:var(--cs-ct)" id="ui-name-me">CT: <span id="s-me">0</span></div>
                <div class="timer" id="timer">0.000</div>
                <div style="color:var(--cs-t)" id="ui-name-opp"><span id="s-opp">0</span> :T</div>
            </div>
        </div>

        <div id="tab-play" class="tab-view active">
            <div class="panel" id="lobby">
                <div class="panel-header">PRE-MATCH LOBBY</div>
                <input type="text" id="room-id" class="cs-input" placeholder="LOBBY CODE (E.G. JUDE99)">
                <div style="display:flex; gap:10px;">
                    <button class="btn-prime" onclick="initNet(true)" style="background:#2d3238; color:white;">HOST</button>
                    <button class="btn-prime" onclick="initNet(false)">JOIN</button>
                </div>
                <div id="host-controls" style="display:none; margin-top:20px; border-top:1px solid #333; padding-top:20px;">
                    <button class="btn-prime" onclick="startMatch()">START MATCH (BO3)</button>
                </div>
            </div>

            <div id="game-view" style="display:none; text-align:center; width:100%;">
                <h1 id="target-word" style="font-size:70px; color:white; margin:20px 0;">READY?</h1>
                <input type="text" id="type-input" class="cs-input" style="text-align:center; font-size:30px;" placeholder="..." autocomplete="off">
                <div id="spec-view" style="display:none; border: 1px dashed var(--cs-orange); padding:20px;">
                    <div style="font-size:10px; color:var(--cs-orange);">OPPONENT TYPING...</div>
                    <div id="opp-text" style="font-size:32px; color:white; min-height:40px;"></div>
                </div>
                <div id="round-result" style="margin-top:20px; color:var(--cs-orange); font-weight:bold; font-size:20px;"></div>
            </div>
        </div>

        <div id="tab-shop" class="tab-view">
            <div class="panel">
                <div class="panel-header">EQUIPMENT SHOP</div>
                <div class="shop-grid">
                    <div class="item-card">
                        <span>[PREMIUM] TAG</span>
                        <span class="item-price">$500</span>
                        <button class="btn-prime" onclick="buy('tag', '[PREMIUM]', 500)" style="font-size:10px;">BUY</button>
                    </div>
                    <div class="item-card">
                        <span style="color: gold;">GOLD NAME</span>
                        <span class="item-price">$1000</span>
                        <button class="btn-prime" onclick="buy('color', 'gold', 1000)" style="font-size:10px;">BUY</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="console" id="logs">Connecting to master server...</div>

    <script>
        let peer, conn, isHost = false, myScore = 0, oppScore = 0;
        let curWord = "", startTime, tInt, myT = 999, oppT = 999;
        let bal = parseInt(localStorage.getItem('cs_bal')) || 0;
        let myItems = JSON.parse(localStorage.getItem('cs_items')) || { tag: '', color: '#fff' };

        function log(m) { const l = document.getElementById('logs'); l.innerHTML += `<div>> ${m}</div>`; l.scrollTop = l.scrollHeight; }
        function updateBal(n) { bal += n; localStorage.setItem('cs_bal', bal); document.getElementById('wallet').innerText = bal; }
        updateBal(0);

        function showTab(id, el) {
            document.querySelectorAll('.tab-view').forEach(v => v.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(v => v.classList.remove('active'));
            document.getElementById('tab-'+id).classList.add('active');
            el.classList.add('active');
        }

        // --- THE NETWORK FIX ---
        function initNet(host) {
            const rawId = document.getElementById('room-id').value.trim().toLowerCase();
            if(!rawId) return alert("Enter a code!");
            
            log("Attempting handshake...");
            if(peer) peer.destroy();
            
            // Random salt prevents "ID Taken" errors
            const finalId = "cs_fat_" + rawId;
            peer = new Peer(host ? finalId : undefined, {
                debug: 1,
                config: {'iceServers': [{ 'urls': 'stun:stun.l.google.com:19302' }]}
            });

            peer.on('open', (id) => {
                document.getElementById('status-light').style.background = 'green';
                log(host ? "Lobby live: " + rawId : "Network ready.");
                if(!host) {
                    conn = peer.connect(finalId);
                    setup(conn);
                }
            });

            peer.on('connection', (c) => {
                conn = c; isHost = true;
                log("Opponent joined!");
                document.getElementById('host-controls').style.display = 'block';
                setup(conn);
            });

            peer.on('error', (e) => {
                log("Error: " + e.type);
                document.getElementById('status-light').style.background = 'red';
                if(e.type === 'peer-unavailable') alert("Room not found. Check the spelling!");
                if(e.type === 'unavailable-id') alert("Room taken. Try adding a number to the end!");
            });
        }

        function setup(c) {
            c.on('open', () => {
                document.getElementById('lobby').style.display = 'none';
                document.getElementById('game-view').style.display = 'block';
                document.getElementById('scoreboard').style.display = 'block';
                c.send({type: 'PROF', items: myItems});
            });
            c.on('data', (d) => {
                if(d.type === 'PROF') {
                    document.getElementById('ui-name-opp').style.color = d.items.color;
                    document.getElementById('ui-name-opp').innerText = `${oppScore} :${d.items.tag} T`;
                }
                if(d.type === 'START') newRound();
                if(d.type === 'WORD') {
                    curWord = d.w; document.getElementById('target-word').innerText = d.w;
                    document.getElementById('type-input').value = ""; document.getElementById('type-input').disabled = false;
                    document.getElementById('type-input').focus(); document.getElementById('round-result').innerText = "";
                    document.getElementById('type-input').style.display = 'block';
                    document.getElementById('spec-view').style.display = 'none';
                }
                if(d.type === 'LIVE') {
                    document.getElementById('type-input').style.display = 'none';
                    document.getElementById('spec-view').style.display = 'block';
                    document.getElementById('opp-text').innerText = d.v;
                    if(d.t) document.getElementById('timer').innerText = d.t;
                }
                if(d.type === 'DONE') { oppT = parseFloat(d.t); if(isHost) check(); }
                if(d.type === 'SYNC') {
                    myScore = d.s1; oppScore = d.s2;
                    document.getElementById('s-me').innerText = myScore;
                    document.getElementById('s-opp').innerText = oppScore;
                    document.getElementById('round-result').innerText = d.msg;
                    if(d.over) document.getElementById('target-word').innerText = d.fin;
                }
            });
        }

        function startMatch() { newRound(); }
        
        function newRound() {
            const words = ["BOMB", "FLASH", "ENTRY", "RUSH", "ACE", "CLUTCH", "PLANT", "DEFUSE", "SMOKE"];
            const w = words[Math.floor(Math.random()*words.length)];
            myT = 999; oppT = 999;
            conn.send({type: 'WORD', w: w});
            localRound(w);
        }

        function localRound(w) {
            curWord = w; document.getElementById('target-word').innerText = w;
            document.getElementById('type-input').value = ""; document.getElementById('type-input').disabled = false;
            document.getElementById('type-input').focus(); document.getElementById('timer').innerText = "0.000";
            document.getElementById('type-input').style.display = 'block';
            document.getElementById('spec-view').style.display = 'none';
        }

        document.getElementById('type-input').oninput = (e) => {
            const v = e.target.value.toUpperCase();
            if(v.length === 1) {
                startTime = performance.now();
                tInt = setInterval(() => {
                    const diff = ((performance.now() - startTime) / 1000).toFixed(3);
                    document.getElementById('timer').innerText = diff;
                    conn.send({type: 'LIVE', v: v, t: diff});
                }, 10);
            }
            conn.send({type: 'LIVE', v: v});
            if(v === curWord) {
                clearInterval(tInt); myT = parseFloat(document.getElementById('timer').innerText);
                document.getElementById('type-input').disabled = true;
                if(isHost) check(); else conn.send({type: 'DONE', t: myT});
            }
        };

        function check() {
            if(myT === 999 || oppT === 999) return;
            let win = myT < oppT;
            if(win) myScore++; else oppScore++;
            let over = myScore >= 3 || oppScore >= 3;
            let fin = myScore >= 3 ? "MATCH MVP (+$250)" : "MATCH LOST";
            if(win) updateBal(50); if(myScore >= 3) updateBal(250);
            
            conn.send({type: 'SYNC', s1: oppScore, s2: myScore, msg: win ? "LOST" : "WON (+$50)", over: over, fin: fin});
            document.getElementById('s-me').innerText = myScore;
            document.getElementById('s-opp').innerText = oppScore;
            document.getElementById('round-result').innerText = win ? "WON (+$50)" : "LOST";
            if(over) document.getElementById('target-word').innerText = fin;
            else setTimeout(newRound, 2000);
        }

        function buy(type, val, cost) {
            if(bal >= cost) {
                updateBal(-cost);
                myItems[type] = val;
                localStorage.setItem('cs_items', JSON.stringify(myItems));
                alert("Equipped!");
            } else alert("Need more cash!");
        }
    </script>
</body>
</html>
