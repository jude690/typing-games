<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FAT: Custom Room Edition</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        :root { --mc-bg: #212121; --mc-green: #55FF55; --mc-red: #FF5555; --mc-yellow: #FFFF55; --mc-gold: #FFD700; --mc-blue: #55FFFF; }
        body { font-family: 'Courier New', monospace; background-color: #1a1a1a; color: #fff; display: flex; flex-direction: column; align-items: center; padding: 20px; text-align: center; }
        .game-box { background-color: #313131; border: 4px solid #000; padding: 20px; width: 90%; max-width: 500px; box-shadow: 8px 8px 0px #000; position: relative; }
        .scoreboard { display: none; background: #222; border: 4px solid #000; padding: 10px; margin-bottom: 15px; width: 100%; max-width: 500px; flex-direction: column; }
        #master-timer { font-size: 32px; color: var(--mc-blue); font-weight: bold; margin-bottom: 10px; text-shadow: 2px 2px #000; }
        #word-display { font-size: 60px; color: var(--mc-yellow); text-shadow: 4px 4px #000; margin: 10px 0; }
        .mc-btn { background-color: #333; color: white; border: 4px solid #000; padding: 10px 15px; cursor: pointer; margin: 5px; font-weight: bold; box-shadow: 3px 3px 0px #000; }
        .panel { background: #313131; border: 4px solid #000; padding: 15px; width: 90%; max-width: 480px; display: block; margin-top: 10px; }
        input { width: 85%; background: #4a4a4a; border: 4px solid #000; padding: 12px; color: white; font-size: 18px; text-align: center; outline: none; margin: 5px 0; }
        #spectator-screen { display: none; background: #000; border: 2px dashed var(--mc-blue); padding: 15px; margin-top: 10px; }
        #opp-live-text { font-size: 30px; color: #fff; text-transform: uppercase; min-height: 40px; }
        .winner-pop { color: var(--mc-gold); font-size: 24px; font-weight: bold; margin-top: 10px; min-height: 30px; }
        #conn-status { font-size: 12px; color: var(--mc-green); margin-bottom: 10px; }
    </style>
</head>
<body>

    <div style="margin-bottom: 10px;">
        <button class="mc-btn" onclick="location.reload()">🔃 RESET GAME</button>
    </div>

    <div id="scoreboard-ui" class="scoreboard">
        <div id="target-txt" style="color: var(--mc-gold); font-size: 12px;">FIRST TO 0</div>
        <div style="display:flex; justify-content:space-around; font-size: 20px;">
            <div>YOU: <span id="my-score" style="color:var(--mc-green)">0</span></div>
            <div>OPP: <span id="opp-score" style="color:var(--mc-green)">0</span></div>
        </div>
    </div>

    <div id="multi-panel" class="panel">
        <div id="setup-area">
            <h3>MULTIPLAYER SETUP</h3>
            <div id="conn-status">Checking Connection...</div>
            <input type="text" id="custom-id-input" placeholder="Type a Room Name (ex: jude123)">
            <div style="display:flex; justify-content:center;">
                <button class="mc-btn" id="host-btn" style="color:var(--mc-green)">HOST ROOM</button>
                <button class="mc-btn" id="join-btn" style="color:var(--mc-blue)">JOIN ROOM</button>
            </div>
        </div>
        
        <div id="goal-screen" style="display:none;">
            <h3 style="color:var(--mc-gold)">SET MATCH GOAL</h3>
            <button class="mc-btn" onclick="setTarget(2)">2</button>
            <button class="mc-btn" onclick="setTarget(3)">3</button>
            <button class="mc-btn" onclick="setTarget(5)">5</button>
        </div>
    </div>

    <div class="game-box" id="main-game" style="display:none;">
        <div id="master-timer">0.000s</div>
        <div id="spectator-screen">
            <div style="font-size: 12px; color:var(--mc-blue)">OPPONENT TYPING...</div>
            <div id="opp-live-text"></div>
        </div>
        <div id="play-area">
            <div id="word-display">READY?</div>
            <input type="text" id="type-input" placeholder="Start typing..." autocomplete="off">
        </div>
        <div id="round-winner" class="winner-pop"></div>
    </div>

    <script>
        const wordList = ["FAT", "JUDE", "MAX", "CHRIS"];
        let peer, conn, isHost = false, scores = { me: 0, opp: 0, target: 3 };
        let currentWord = "", startTime, timerInterval, active = false, myLastTime = 999, oppLastTime = 999;

        const statusTxt = document.getElementById('conn-status');
        const customIdBox = document.getElementById('custom-id-input');

        // HOST BUTTON
        document.getElementById('host-btn').onclick = () => {
            const id = customIdBox.value.trim();
            if(!id) return alert("Please type a Room Name first!");
            startPeer(id, true);
        };

        // JOIN BUTTON
        document.getElementById('join-btn').onclick = () => {
            const id = customIdBox.value.trim();
            if(!id) return alert("Please type the Room Name to join!");
            startPeer(null, false);
            setTimeout(() => {
                conn = peer.connect(id);
                bindEvents(conn);
            }, 1000);
        };

        function startPeer(id, hosting) {
            if(peer) peer.destroy();
            peer = new Peer(id);
            
            peer.on('open', (openedId) => {
                statusTxt.innerText = hosting ? "ROOM CREATED: " + openedId : "READY TO JOIN";
                if(!hosting) statusTxt.innerText = "Attempting to join " + customIdBox.value + "...";
            });

            peer.on('connection', (c) => {
                conn = c; isHost = true;
                document.getElementById('setup-area').style.display = 'none';
                document.getElementById('goal-screen').style.display = 'block';
                bindEvents(conn);
            });

            peer.on('error', (err) => {
                alert("Room Error: " + err.type + ". Try a different Room Name.");
                location.reload();
            });
        }

        function bindEvents(c) {
            c.on('open', () => {
                statusTxt.innerText = "MATCH CONNECTED!";
                document.getElementById('main-game').style.display = 'block';
            });
            c.on('data', (d) => {
                if(d.type === 'START') {
                    scores.target = d.goal;
                    document.getElementById('multi-panel').style.display = 'none';
                    document.getElementById('scoreboard-ui').style.display = 'flex';
                    document.getElementById('target-txt').innerText = "FIRST TO " + d.goal;
                }
                if(d.type === 'TURN') {
                    updateRoundUI(true);
                    currentWord = d.w;
                    document.getElementById('word-display').innerText = d.w;
                    document.getElementById('type-input').disabled = false;
                    document.getElementById('type-input').value = "";
                    document.getElementById('type-input').focus();
                    document.getElementById('round-winner').innerText = "";
                }
                if(d.type === 'LIVE') {
                    updateRoundUI(false);
                    document.getElementById('opp-live-text').innerText = d.v;
                    if(d.time) document.getElementById('master-timer').innerText = d.time + "s";
                }
                if(d.type === 'FINISH') {
                    oppLastTime = parseFloat(d.time);
                    if(isHost) checkWinner();
                }
                if(d.type === 'SYNC') {
                    scores.me = d.s1; scores.opp = d.s2;
                    document.getElementById('my-score').innerText = scores.me;
                    document.getElementById('opp-score').innerText = scores.opp;
                    document.getElementById('round-winner').innerText = d.msg;
                    if(d.over) endGame(d.final);
                }
            });
        }

        function setTarget(n) {
            scores.target = n;
            conn.send({type: 'START', goal: n});
            document.getElementById('multi-panel').style.display = 'none';
            document.getElementById('scoreboard-ui').style.display = 'flex';
            document.getElementById('target-txt').innerText = "FIRST TO " + n;
            nextRound();
        }

        function nextRound() {
            if(scores.me >= scores.target || scores.opp >= scores.target) return;
            const w = wordList[Math.floor(Math.random()*wordList.length)];
            myLastTime = 999; oppLastTime = 999;
            conn.send({type: 'TURN', w: w});
            setupRound(w);
        }

        function setupRound(w) {
            updateRoundUI(true);
            currentWord = w;
            document.getElementById('word-display').innerText = w;
            document.getElementById('type-input').disabled = false;
            document.getElementById('type-input').value = "";
            document.getElementById('type-input').focus();
            document.getElementById('round-winner').innerText = "";
        }

        function updateRoundUI(isMe) {
            document.getElementById('play-area').style.display = isMe ? 'block' : 'none';
            document.getElementById('spectator-screen').style.display = isMe ? 'none' : 'block';
        }

        document.getElementById('type-input').oninput = (e) => {
            const val = e.target.value.toUpperCase();
            if(!active && val.length > 0) {
                active = true; startTime = performance.now();
                timerInterval = setInterval(() => {
                    const elapsed = ((performance.now() - startTime) / 1000).toFixed(3);
                    document.getElementById('master-timer').innerText = elapsed + "s";
                    if(conn) conn.send({type: 'LIVE', v: val, time: elapsed});
                }, 10);
            }
            if(val === currentWord) {
                clearInterval(timerInterval); active = false;
                myLastTime = parseFloat(document.getElementById('master-timer').innerText);
                document.getElementById('type-input').disabled = true;
                if(isHost) checkWinner();
                else conn.send({type: 'FINISH', time: myLastTime});
            }
        };

        function checkWinner() {
            if(myLastTime === 999 || oppLastTime === 999) return;
            let msg = myLastTime < oppLastTime ? "YOU WERE FASTER!" : "OPPONENT WAS FASTER!";
            if(myLastTime < oppLastTime) scores.me++; else scores.opp++;
            
            let over = scores.me >= scores.target || scores.opp >= scores.target;
            let final = scores.me >= scores.target ? "MATCH WON!" : "MATCH LOST!";
            
            conn.send({type: 'SYNC', s1: scores.opp, s2: scores.me, msg: msg, over: over, final: final});
            document.getElementById('my-score').innerText = scores.me;
            document.getElementById('opp-score').innerText = scores.opp;
            document.getElementById('round-winner').innerText = msg;
            if(over) endGame(final); else setTimeout(nextRound, 2500);
        }

        function endGame(m) {
            document.getElementById('word-display').innerText = "GG";
            document.getElementById('round-winner').innerText = m;
            document.getElementById('type-input').style.display = 'none';
        }
    </script>
</body>
</html>
