<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FAT: Global Offensive | Multiplayer Typing</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        :root {
            --cs-orange: #ff9a00; --cs-bg: #0d0e11; --cs-panel: #1b1e23;
            --cs-border: #32383e; --cs-text: #9ba1a6; --cs-white: #ffffff;
            --cs-ct: #5da7db; --cs-t: #de9b35; --cs-green: #4caf50; --cs-red: #ff4444;
        }
        body {
            background-color: var(--cs-bg); color: var(--cs-text); font-family: 'Segoe UI', Arial, sans-serif;
            margin: 0; padding: 0; height: 100vh; display: flex; flex-direction: column; text-transform: uppercase;
            overflow: hidden;
        }

        /* Navigation Bar */
        .navbar {
            display: flex; justify-content: space-between; align-items: center; background: #000;
            padding: 0 40px; height: 60px; border-bottom: 1px solid var(--cs-border);
        }
        .nav-links { display: flex; gap: 30px; height: 100%; }
        .nav-item { 
            display: flex; align-items: center; cursor: pointer; color: var(--cs-text);
            font-weight: 800; font-size: 13px; border-bottom: 3px solid transparent; transition: 0.2s;
        }
        .nav-item:hover, .nav-item.active { color: var(--cs-white); border-bottom: 3px solid var(--cs-orange); }
        .wallet { color: var(--cs-green); font-weight: 900; font-size: 16px; }

        /* Status Light Bar */
        .status-strip { background: #15171c; padding: 5px 40px; font-size: 10px; display: flex; gap: 20px; border-bottom: 1px solid var(--cs-border); }
        .stat { display: flex; align-items: center; gap: 6px; }
        .dot { width: 8px; height: 8px; border-radius: 50%; background: #444; }
        .dot.active { background: var(--cs-green); box-shadow: 0 0 5px var(--cs-green); }

        /* Layout */
        .app { flex: 1; display: flex; flex-direction: column; align-items: center; padding: 40px 20px; overflow-y: auto; }
        .tab { display: none; width: 100%; max-width: 500px; flex-direction: column; }
        .tab.active { display: flex; }

        /* Panels */
        .panel { background: var(--cs-panel); border: 1px solid var(--cs-border); padding: 30px; width: 100%; box-shadow: 0 10px 40px rgba(0,0,0,0.5); }
        .panel-h { font-size: 16px; color: var(--cs-white); margin-bottom: 20px; border-left: 4px solid var(--cs-orange); padding-left: 10px; font-weight: 900; }

        /* Inputs & Buttons */
        .input { width: 100%; background: #000; border: 1px solid var(--cs-border); padding: 15px; color: #fff; margin-bottom: 15px; box-sizing: border-box; outline: none; font-family: monospace; }
        .input:focus { border-color: var(--cs-orange); }
        .btn { width: 100%; padding: 15px; font-weight: 900; cursor: pointer; border: none; transition: 0.1s; }
        .btn-prime { background: var(--cs-orange); color: #000; }
        .btn-sec { background: #2d3238; color: #fff; }
        .btn:hover { filter: brightness(1.1); }

        /* Scoreboard Overlay */
        .scoreboard { display: none; width: 100%; max-width: 450px; background: rgba(0,0,0,0.8); border: 1px solid var(--cs-border); padding: 10px 20px; margin-bottom: 20px; box-sizing: border-box; }
        .score-flex { display: flex; justify-content: space-between; align-items: center; }
        .score-num { font-size: 30px; font-weight: 900; color: #fff; }
        .timer { color: var(--cs-orange); font-family: monospace; font-size: 22px; }

        /* Shop Grid */
        .shop-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .shop-card { background: #121417; border: 1px solid var(--cs-border); padding: 15px; text-align: center; }
        .price { color: var(--cs-green); font-weight: bold; margin: 10px 0; display: block; }

        /* Debug Log */
        .console { position: fixed; bottom: 0; width: 100%; height: 80px; background: #000; color: #00ff00; font-family: monospace; font-size: 10px; padding: 10px; border-top: 1px solid var(--cs-border); overflow-y: auto; text-transform: none; z-index: 100; }
    </style>
</head>
<body>

    <div class="navbar">
        <div class="nav-links">
            <div class="nav-item active" onclick="tab('play', this)">PLAY</div>
            <div class="nav-item" onclick="tab('shop', this)">SHOP</div>
        </div>
        <div class="wallet">$ <span id="balance">0</span></div>
    </div>

    <div class="status-strip">
        <div class="stat">NETWORK: <div id="net-dot" class="dot"></div></div>
        <div class="stat">ROOM: <span id="room-status">IDLE</span></div>
    </div>

    <div class="app">
        <div id="scoreboard" class="scoreboard">
            <div class="score-flex">
                <div style="color: var(--cs-ct)">CT <span id="s-me" class="score-num">0</span></div>
                <div id="main-timer" class="timer">0.000</div>
                <div style="color: var(--cs-t)"><span id="s-opp" class="score-num">0</span> T</div>
            </div>
        </div>

        <div id="tab-play" class="tab active">
            <div class="panel" id="lobby">
                <div class="panel-h">LOBBY TERMINAL</div>
                <input type="text" id="room-input" class="input" placeholder="LOBBY ID (E.G. JUDE123)">
                <div style="display:flex; gap:10px;">
                    <button class="btn btn-sec" onclick="initNet(true)">HOST</button>
                    <button class="btn btn-prime" onclick="initNet(false)">JOIN</button>
                </div>
                <div id="host-tools" style="display:none; margin-top:20px; border-top:1px solid #333; padding-top:20px;">
                    <button class="btn btn-prime" onclick="startGame()">START MATCH (BO3)</button>
                </div>
            </div>

            <div id="game" style="display:none; width:100%; text-align:center;">
                <div id="word-target" style="font-size: 65px; font-weight: 900; color: #fff; margin: 20px 0;">READY?</div>
                <input type="text" id="type-box" class="input" style="text-align:center; font-size: 28px;" placeholder="..." autocomplete="off">
                <div id="enemy-spectate" style="display:none; padding: 20px; border: 1px dashed var(--cs-orange); background: rgba(255,154,0,0.05);">
                    <div style="font-size:10px; color:var(--cs-orange);">ENEMEY SIGHTED...</div>
                    <div id="enemy-text" style="font-size:32px; color:#fff; min-height:40px;"></div>
                </div>
                <div id="round-msg" style="margin-top:20px; color:var(--cs-orange); font-weight:bold;"></div>
            </div>
        </div>

        <div id="tab-shop" class="tab">
            <div class="panel">
                <div class="panel-h">MARKETPLACE</div>
                <div class="shop-grid">
                    <div class="shop-card">
                        <div style="font-weight:bold; color:white;">RED NAME</div>
                        <span class="price">$500</span>
                        <button class="btn btn-prime" style="padding:5px; font-size:10px;" onclick="buyItem('red', 500)">PURCHASE</button>
                    </div>
                    <div class="shop-card">
                        <div style="font-weight:bold; color:gold;">GOLD NAME</div>
                        <span class="price">$1500</span>
                        <button class="btn btn-prime" style="padding:5px; font-size:10px;" onclick="buyItem('gold', 1500)">PURCHASE</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="console" id="log">
        [SYS] AWAITING INPUT...
    </div>

    <script>
        // --- GAME STATE ---
        let peer, conn, isHost = false, scores = { me: 0, opp: 0 };
        let currentWord = "", startTime, timerInterval, typing = false, myTime = 999, oppTime = 999;
        let bal = parseInt(localStorage.getItem('cs_fat_bal')) || 0;

        function log(m) { const c = document.getElementById('log'); c.innerHTML += `<div>> ${m}</div>`; c.scrollTop = c.scrollHeight; }
        function tab(name, el) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            document.getElementById('tab-'+name).classList.add('active');
            el.classList.add('active');
        }

        function updateBal(n) { bal += n; localStorage.setItem('cs_fat_bal', bal); document.getElementById('balance').innerText = bal; }
        updateBal(0);

        // --- NETWORK CORE (FIXED) ---
        function initNet(hosting) {
            const rawId = document.getElementById('room-input').value.trim().toLowerCase();
            if(!rawId) return alert("ENTER A ROOM ID");

            if(peer) peer.destroy();
            
            // Using more reliable STUN servers and a specific App Prefix
            const finalId = "fat_global_" + rawId;
            peer = new Peer(hosting ? finalId : undefined, {
                config: {'iceServers': [{ 'urls': 'stun:stun.l.google.com:19302' }, { 'urls': 'stun:stun1.l.google.com:19302' }]},
                debug: 1
            });

            peer.on('open', (id) => {
                document.getElementById('net-dot').className = 'dot active';
                document.getElementById('room-status').innerText = hosting ? "HOSTING: " + rawId : "READY";
                log(hosting ? "LOBBY CREATED ON CLOUD" : "READY TO CONNECT");
                if(!hosting) {
                    log("HANDSHAKING WITH HOST...");
                    conn = peer.connect(finalId, { reliable: true });
                    bindConn(conn);
                }
            });

            peer.on('connection', (c) => {
                conn = c; isHost = true;
                log("PLAYER CONNECTED TO LOBBY");
                document.getElementById('host-tools').style.display = 'block';
                bindConn(conn);
            });

            peer.on('error', (err) => {
                log("NET ERROR: " + err.type.toUpperCase());
                if(err.type === 'unavailable-id') alert("ROOM TAKEN! PICK A NEW NAME.");
                document.getElementById('net-dot').className = 'dot';
            });

            // HEARTBEAT SYSTEM: Stops "Network Error" by keeping connection alive
            setInterval(() => { if(peer && !peer.disconnected) peer.socket.send({type: 'HEARTBEAT'}); }, 5000);
        }

        function bindConn(c) {
            c.on('open', () => {
                document.getElementById('lobby').style.display = 'none';
                document.getElementById('game').style.display = 'block';
                document.getElementById('scoreboard').style.display = 'block';
            });
            c.on('data', (d) => {
                if(d.type === 'ROUND_START') {
                    currentWord = d.word; document.getElementById('word-target').innerText = d.word;
                    resetUIForRound();
                }
                if(d.type === 'TYPING') {
                    document.getElementById('type-box').style.display = 'none';
                    document.getElementById('enemy-spectate').style.display = 'block';
                    document.getElementById('enemy-text').innerText = d.val;
                    if(d.time) document.getElementById('main-timer').innerText = d.time;
                }
                if(d.type === 'DONE') { oppTime = parseFloat(d.time); if(isHost) judgeWinner(); }
                if(d.type === 'SYNC') {
                    scores.me = d.s1; scores.opp = d.s2;
                    document.getElementById('s-me').innerText = scores.me;
                    document.getElementById('s-opp').innerText = scores.opp;
                    document.getElementById('round-msg').innerText = d.msg;
                    if(d.wonRound) updateBal(100);
                    if(d.matchOver) {
                        document.getElementById('word-target').innerText = d.final;
                        document.getElementById('type-box').style.display = 'none';
                    }
                }
            });
        }

        // --- GAME LOGIC ---
        function startGame() { startRound(); }

        function startRound() {
            const words = ["BOMB", "FLASH", "DEAGLE", "RUSH", "ACE", "CLUTCH", "PLANT", "DEFUSE", "SMOKE", "KNIFE"];
            const w = words[Math.floor(Math.random()*words.length)];
            myTime = 999; oppTime = 999;
            conn.send({type: 'ROUND_START', word: w});
            localRound(w);
        }

        function localRound(w) {
            currentWord = w;
            document.getElementById('word-target').innerText = w;
            resetUIForRound();
        }

        function resetUIForRound() {
            document.getElementById('type-box').value = ""; 
            document.getElementById('type-box').disabled = false;
            document.getElementById('type-box').focus(); 
            document.getElementById('type-box').style.display = 'block';
            document.getElementById('enemy-spectate').style.display = 'none';
            document.getElementById('main-timer').innerText = "0.000";
            document.getElementById('round-msg').innerText = "";
        }

        document.getElementById('type-box').oninput = (e) => {
            const val = e.target.value.toUpperCase();
            if(!typing && val.length > 0) {
                typing = true; startTime = performance.now();
                timerInterval = setInterval(() => {
                    const diff = ((performance.now() - startTime) / 1000).toFixed(3);
                    document.getElementById('main-timer').innerText = diff;
                    conn.send({type: 'TYPING', val: val, time: diff});
                }, 10);
            }
            conn.send({type: 'TYPING', val: val});
            if(val === currentWord) {
                clearInterval(timerInterval); typing = false;
                myTime = parseFloat(document.getElementById('main-timer').innerText);
                document.getElementById('type-box').disabled = true;
                if(isHost) judgeWinner(); else conn.send({type: 'DONE', time: myTime});
            }
        };

        function judgeWinner() {
            if(myTime === 999 || oppTime === 999) return;
            let win = myTime < oppTime;
            if(win) scores.me++; else scores.opp++;
            let over = scores.me >= 3 || scores.opp >= 3;
            let fin = scores.me >= 3 ? "MATCH MVP (+$500)" : "MATCH LOST";
            
            conn.send({type: 'SYNC', s1: scores.opp, s2: scores.me, msg: win ? "LOST" : "WON (+$100)", matchOver: over, final: fin, wonRound: !win});
            document.getElementById('s-me').innerText = scores.me;
            document.getElementById('s-opp').innerText = scores.opp;
            document.getElementById('round-msg').innerText = win ? "WON (+$100)" : "LOST";
            if(win) updateBal(100);
            if(over) {
                document.getElementById('word-target').innerText = fin;
                if(scores.me >= 3) updateBal(500);
            } else setTimeout(startRound, 2500);
        }

        function buyItem(name, price) {
            if(bal >= price) { updateBal(-price); alert("EQUIPPED: " + name); }
            else alert("NEED MORE CASH");
        }
    </script>
</body>
</html>
