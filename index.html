<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FAT: Premiere (Stable)</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        :root {
            --cs-orange: #ff9a00; --cs-bg: #0d0e11; --cs-panel: #1b1e23;
            --cs-border: #32383e; --cs-text: #9ba1a6; --cs-white: #ffffff;
            --cs-ct: #5da7db; --cs-t: #de9b35; --cs-green: #4caf50; --cs-red: #ff4444;
        }
        body { background-color: var(--cs-bg); color: var(--cs-text); font-family: 'Segoe UI', sans-serif; margin: 0; text-transform: uppercase; overflow: hidden; height: 100vh; display: flex; flex-direction: column; }
        
        /* Navbar */
        .navbar { display: flex; justify-content: space-between; align-items: center; background: #000; padding: 0 30px; height: 60px; border-bottom: 1px solid var(--cs-border); }
        .nav-links { display: flex; gap: 20px; }
        .nav-item { cursor: pointer; font-weight: 800; font-size: 13px; color: var(--cs-text); border-bottom: 3px solid transparent; padding: 18px 0; }
        .nav-item.active { color: white; border-bottom: 3px solid var(--cs-orange); }

        /* Status Bar */
        .status-bar { background: #1a1c21; padding: 5px 30px; font-size: 10px; display: flex; gap: 15px; border-bottom: 1px solid var(--cs-border); }
        .stat { display: flex; align-items: center; gap: 5px; }
        .dot { width: 8px; height: 8px; border-radius: 50%; background: grey; }
        .dot.online { background: var(--cs-green); box-shadow: 0 0 5px var(--cs-green); }
        .dot.offline { background: var(--cs-red); }

        /* Layout */
        .main { flex: 1; display: flex; flex-direction: column; align-items: center; padding: 40px 20px; position: relative; }
        .tab { display: none; width: 100%; max-width: 450px; }
        .tab.active { display: flex; flex-direction: column; }

        /* GUI Elements */
        .panel { background: var(--cs-panel); border: 1px solid var(--cs-border); padding: 25px; box-shadow: 0 10px 40px rgba(0,0,0,0.5); }
        .panel-h { color: white; font-weight: 900; margin-bottom: 15px; font-size: 14px; border-left: 3px solid var(--cs-orange); padding-left: 10px; }
        .cs-input { width: 100%; background: #000; border: 1px solid var(--cs-border); padding: 12px; color: white; margin-bottom: 10px; box-sizing: border-box; outline: none; font-family: monospace; }
        .btn { width: 100%; padding: 12px; font-weight: 900; border: none; cursor: pointer; transition: 0.2s; margin-top: 5px; }
        .btn-orange { background: var(--cs-orange); color: black; }
        .btn-grey { background: #2d3238; color: white; }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }

        /* Shop Grid */
        .shop-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .item { background: #121417; border: 1px solid var(--cs-border); padding: 15px; text-align: center; }
        .price { color: var(--cs-green); display: block; margin: 10px 0; font-weight: bold; }

        /* Scoreboard Overlay */
        .score-wrap { display: none; width: 100%; max-width: 400px; background: rgba(0,0,0,0.8); border: 1px solid var(--cs-border); padding: 10px 20px; margin-bottom: 20px; }
        .score-flex { display: flex; justify-content: space-between; align-items: center; }
        .score-val { font-size: 28px; font-weight: 900; color: white; }

        /* Console */
        .console { position: absolute; bottom: 0; width: 100%; height: 100px; background: #000; color: #00ff00; font-family: monospace; font-size: 11px; padding: 10px; border-top: 1px solid var(--cs-border); overflow-y: auto; text-transform: none; }
    </style>
</head>
<body>

    <div class="navbar">
        <div class="nav-links">
            <div class="nav-item active" onclick="showTab('play')">PLAY</div>
            <div class="nav-item" onclick="showTab('shop')">SHOP</div>
        </div>
        <div style="color:var(--cs-green); font-weight:bold;">$ <span id="money">0</span></div>
    </div>

    <div class="status-bar">
        <div class="stat">SERVER: <div id="dot-server" class="dot"></div> <span id="text-server">CHECKING...</span></div>
        <div class="stat">ROOM: <div id="dot-room" class="dot"></div> <span id="text-room">IDLE</span></div>
    </div>

    <div class="main">
        
        <div id="scoreboard" class="score-wrap">
            <div class="score-flex">
                <div style="color:var(--cs-ct)">CT <span id="sc-me" class="score-val">0</span></div>
                <div id="timer" style="color:var(--cs-orange); font-family:monospace; font-size:20px;">0.000</div>
                <div style="color:var(--cs-t)"><span id="sc-opp" class="score-val">0</span> T</div>
            </div>
        </div>

        <div id="tab-play" class="tab active">
            <div class="panel" id="lobby-ui">
                <div class="panel-h">MATCHMAKING</div>
                <input type="text" id="room-id" class="cs-input" placeholder="LOBBY NAME (e.g. JUDE123)">
                <div style="display:flex; gap:10px;">
                    <button class="btn btn-grey" id="host-btn" onclick="init(true)">HOST</button>
                    <button class="btn btn-orange" id="join-btn" onclick="init(false)">JOIN</button>
                </div>
                <div id="host-tools" style="display:none; margin-top:15px; border-top:1px solid #333; padding-top:15px;">
                    <button class="btn btn-orange" onclick="startMatch()">START BO3</button>
                </div>
            </div>

            <div id="game-ui" style="display:none; text-align:center;">
                <div id="word" style="font-size:60px; font-weight:900; color:white; margin-bottom:20px;">READY?</div>
                <input type="text" id="type-box" class="cs-input" style="text-align:center; font-size:24px;" placeholder="TYPE..." autocomplete="off">
                <div id="opp-view" style="display:none; border:1px dashed var(--cs-orange); padding:20px;">
                    <div style="font-size:10px; color:var(--cs-orange); margin-bottom:5px;">OPPONENT IS TYPING...</div>
                    <div id="opp-text" style="font-size:32px; color:white; min-height:40px;"></div>
                </div>
                <div id="msg" style="margin-top:15px; color:var(--cs-orange); font-weight:bold;"></div>
            </div>
        </div>

        <div id="tab-shop" class="tab">
            <div class="panel">
                <div class="panel-h">ITEM SHOP</div>
                <div class="shop-grid">
                    <div class="item">
                        <span>RED NAME</span>
                        <span class="price">$250</span>
                        <button class="btn btn-orange" style="font-size:10px; padding:5px;" onclick="buy('red', 250)">BUY</button>
                    </div>
                    <div class="item">
                        <span style="color:gold;">GOLD NAME</span>
                        <span class="price">$1000</span>
                        <button class="btn btn-orange" style="font-size:10px; padding:5px;" onclick="buy('gold', 1000)">BUY</button>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <div class="console" id="log">SYSTEM INITIALIZING...</div>

    <script>
        let peer, conn, isHost = false, myS = 0, oppS = 0;
        let curWord = "", startT, tInt, myT = 999, oppT = 999;
        let bal = parseInt(localStorage.getItem('f_bal')) || 0;

        function log(m) { const l = document.getElementById('log'); l.innerHTML += `<div>> ${m}</div>`; l.scrollTop = l.scrollHeight; }
        function showTab(t) {
            document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(x => x.classList.remove('active'));
            document.getElementById('tab-'+t).classList.add('active');
            event.target.classList.add('active');
        }

        function updateBal(n) { bal += n; localStorage.setItem('f_bal', bal); document.getElementById('money').innerText = bal; }
        updateBal(0);

        // --- NETWORK FIX & DEBUG ---
        function setStatus(type, status, text) {
            const dot = document.getElementById('dot-'+type);
            const txt = document.getElementById('text-'+text ? type : type);
            if (status === 'on') { dot.className = 'dot online'; document.getElementById('text-'+type).innerText = text || 'ONLINE'; }
            if (status === 'off') { dot.className = 'dot offline'; document.getElementById('text-'+type).innerText = text || 'ERROR'; }
        }

        function init(hostMode) {
            const id = document.getElementById('room-id').value.trim().toLowerCase();
            if(!id) return alert("ENTER LOBBY NAME");
            
            log("DIAGNOSING CONNECTION...");
            if(peer) peer.destroy();

            // We use standard Google STUN servers to bypass router blocks
            peer = new Peer("fat_v4_" + id, {
                config: {'iceServers': [{ 'urls': 'stun:stun.l.google.com:19302' }]},
                debug: 1
            });

            // Set a timeout: if server doesn't respond in 5 seconds, it's a Server Error
            const netTimeout = setTimeout(() => {
                if(!peer.open) {
                    log("SERVER UNRESPONSIVE. PeerJS Cloud might be down.", "off");
                    setStatus('server', 'off', 'TIMED OUT');
                }
            }, 5000);

            peer.on('open', () => {
                clearTimeout(netTimeout);
                setStatus('server', 'on');
                setStatus('room', 'on', hostMode ? 'HOSTING' : 'READY');
                log(hostMode ? "LOBBY CREATED" : "CONNECTED TO CLOUD");
                if(!hostMode) {
                    log("LOOKING FOR HOST...");
                    conn = peer.connect("fat_v4_" + id);
                    setup(conn);
                }
            });

            peer.on('connection', (c) => {
                conn = c; isHost = true;
                log("PLAYER JOINED");
                document.getElementById('host-tools').style.display = 'block';
                setup(conn);
            });

            peer.on('error', (err) => {
                log("NET ERROR: " + err.type);
                setStatus('server', 'off', err.type);
                if(err.type === 'unavailable-id') alert("NAME TAKEN! TRY A DIFFERENT NAME.");
            });
        }

        function setup(c) {
            c.on('open', () => {
                document.getElementById('lobby-ui').style.display = 'none';
                document.getElementById('game-ui').style.display = 'block';
                document.getElementById('scoreboard').style.display = 'block';
            });
            c.on('data', (d) => {
                if(d.type === 'WORD') {
                    curWord = d.w; document.getElementById('word').innerText = d.w;
                    document.getElementById('type-box').value = ""; document.getElementById('type-box').disabled = false;
                    document.getElementById('type-box').focus(); document.getElementById('type-box').style.display = 'block';
                    document.getElementById('opp-view').style.display = 'none';
                    document.getElementById('msg').innerText = "";
                }
                if(d.type === 'LIVE') {
                    document.getElementById('type-box').style.display = 'none';
                    document.getElementById('opp-view').style.display = 'block';
                    document.getElementById('opp-text').innerText = d.v;
                    if(d.t) document.getElementById('timer').innerText = d.t;
                }
                if(d.type === 'DONE') { oppT = parseFloat(d.t); if(isHost) check(); }
                if(d.type === 'SYNC') {
                    myS = d.s1; oppS = d.s2;
                    document.getElementById('sc-me').innerText = myS;
                    document.getElementById('sc-opp').innerText = oppS;
                    document.getElementById('msg').innerText = d.msg;
                    if(d.win) updateBal(50);
                    if(d.over) {
                        document.getElementById('word').innerText = d.fin;
                        document.getElementById('type-box').style.display = 'none';
                        if(d.fin.includes("MVP")) updateBal(200);
                    }
                }
            });
        }

        function startMatch() { next(); }
        function next() {
            const list = ["BOMB", "FLASH", "ENTRY", "RUSH", "ACE", "CLUTCH", "PLANT", "DEFUSE"];
            const w = list[Math.floor(Math.random()*list.length)];
            myT = 999; oppT = 999;
            conn.send({type: 'WORD', w: w});
            local(w);
        }

        function local(w) {
            curWord = w; document.getElementById('word').innerText = w;
            document.getElementById('type-box').value = ""; document.getElementById('type-box').disabled = false;
            document.getElementById('type-box').focus(); document.getElementById('timer').innerText = "0.000";
            document.getElementById('type-box').style.display = 'block';
            document.getElementById('opp-view').style.display = 'none';
        }

        document.getElementById('type-box').oninput = (e) => {
            const v = e.target.value.toUpperCase();
            if(v.length === 1) {
                startT = performance.now();
                tInt = setInterval(() => {
                    const diff = ((performance.now() - startT) / 1000).toFixed(3);
                    document.getElementById('timer').innerText = diff;
                    conn.send({type: 'LIVE', v: v, t: diff});
                }, 10);
            }
            if(v === curWord) {
                clearInterval(tInt); myT = parseFloat(document.getElementById('timer').innerText);
                document.getElementById('type-box').disabled = true;
                if(isHost) check(); else conn.send({type: 'DONE', t: myT});
            }
        };

        function check() {
            if(myT === 999 || oppT === 999) return;
            let win = myT < oppT;
            if(win) myS++; else oppS++;
            let over = myS >= 3 || oppS >= 3;
            let fin = myS >= 3 ? "MATCH MVP (+$200)" : "MATCH LOST";
            conn.send({type: 'SYNC', s1: oppS, s2: myS, msg: win ? "LOST" : "WON (+$50)", over: over, fin: fin, win: !win});
            document.getElementById('sc-me').innerText = myS;
            document.getElementById('sc-opp').innerText = oppS;
            document.getElementById('msg').innerText = win ? "WON (+$50)" : "LOST";
            if(win) updateBal(50);
            if(over) {
                document.getElementById('word').innerText = fin;
                if(myS >= 3) updateBal(200);
            } else setTimeout(next, 2000);
        }

        function buy(item, price) {
            if(bal >= price) { updateBal(-price); alert("EQUIPPED!"); } else alert("NO MONEY");
        }
    </script>
</body>
</html>
