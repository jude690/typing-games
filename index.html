<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FAT: Match Point Edition</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        :root {
            --mc-bg: #212121; --mc-green: #55FF55; --mc-red: #FF5555;
            --mc-white: #FFFFFF; --mc-yellow: #FFFF55; --mc-gold: #FFD700; --mc-blue: #55FFFF;
        }
        body {
            font-family: 'Courier New', Courier, monospace; background-color: #1a1a1a;
            color: var(--mc-white); display: flex; flex-direction: column; align-items: center; padding: 20px; margin: 0;
        }
        .game-box {
            background-color: #313131; border: 4px solid #000; padding: 20px; width: 90%; max-width: 500px;
            text-align: center; box-shadow: 8px 8px 0px #000; position: relative;
        }
        .scoreboard {
            display: none; flex-direction: column; background: #222; border: 4px solid #000;
            padding: 10px; margin-bottom: 15px; width: 100%; max-width: 500px; box-sizing: border-box;
        }
        .scores-row { display: flex; justify-content: space-around; width: 100%; }
        .score-box { text-align: center; flex: 1; }
        .score-val { font-size: 28px; color: var(--mc-green); font-weight: bold; }
        
        #word-display { font-size: 60px; color: var(--mc-yellow); text-shadow: 4px 4px #000; margin: 20px 0; }
        
        #spectator-screen {
            display: none; background: #000; border: 2px dashed var(--mc-blue);
            padding: 15px; margin-top: 10px; color: var(--mc-blue);
        }
        #opp-live-text { font-size: 30px; letter-spacing: 5px; min-height: 40px; color: #fff; }

        input {
            width: 85%; background: #4a4a4a; border: 4px solid #000; padding: 15px;
            color: white; font-size: 24px; text-align: center; outline: none;
        }
        .mc-btn {
            background-color: #333; color: white; border: 4px solid #000; padding: 10px 15px;
            cursor: pointer; margin: 5px; box-shadow: 3px 3px 0px #000; font-family: inherit; font-weight: bold;
        }
        .panel {
            background: #313131; border: 4px solid #000; padding: 15px; width: 90%; max-width: 480px;
            display: none; margin-top: 10px; box-shadow: 6px 6px 0px #000;
        }
        #setup-screen { display: none; flex-direction: column; align-items: center; }
        #adv-popup {
            position: fixed; top: 20px; right: -400px; width: 250px; background: #222;
            border: 4px solid #000; padding: 10px; transition: 0.5s; z-index: 3000;
        }
        #adv-popup.show { right: 20px; }
    </style>
</head>
<body>

    <div id="adv-popup">
        <div style="color:var(--mc-yellow); font-weight:bold;">Advancement!</div>
        <div id="p-name"></div>
    </div>

    <div style="margin-bottom: 10px;">
        <button class="mc-btn" onclick="toggle('multi-panel')" style="color:var(--mc-blue)">🌐 MULTIPLAYER</button>
        <button class="mc-btn" onclick="location.reload()">🔃 RESET</button>
    </div>

    <div id="scoreboard-ui" class="scoreboard">
        <div id="target-txt" style="color: var(--mc-gold); font-size: 12px; margin-bottom: 5px;">FIRST TO 5</div>
        <div class="scores-row">
            <div class="score-box">YOU<br><span id="my-score" class="score-val">0</span></div>
            <div class="score-box">OPPONENT<br><span id="opp-score" class="score-val">0</span></div>
        </div>
    </div>

    <div id="multi-panel" class="panel">
        <div id="id-section">
            <h3>Multiplayer Hub</h3>
            <input type="text" id="my-id-box" readonly style="font-size:12px; width:95%; margin-bottom:10px;">
            <input type="text" id="join-id-box" placeholder="Paste Opponent ID..." style="font-size:14px; width:95%;">
            <button class="mc-btn" id="connect-btn" style="width:100%; margin-top:10px;">CONNECT</button>
        </div>

        <div id="setup-screen">
            <h3 style="color:var(--mc-gold)">MATCH SETUP</h3>
            <p>First player to how many points?</p>
            <div>
                <button class="mc-btn" onclick="setTarget(2)">2</button>
                <button class="mc-btn" onclick="setTarget(3)">3</button>
                <button class="mc-btn" onclick="setTarget(5)">5</button>
                <button class="mc-btn" onclick="setTarget(7)">7</button>
                <button class="mc-btn" onclick="setTarget(10)">10</button>
            </div>
        </div>
    </div>

    <div class="game-box">
        <div id="spectator-screen">
            <div style="font-size: 12px;">WATCHING OPPONENT...</div>
            <div id="opp-live-text"></div>
        </div>
        <div id="play-area">
            <div id="word-display">WAITING...</div>
            <input type="text" id="type-input" placeholder="Ready?" disabled autocomplete="off">
            <div id="timer" style="margin-top:15px; font-size:18px;">0.000s</div>
        </div>
    </div>

    <script>
        const input = document.getElementById('type-input');
        const timerText = document.getElementById('timer');
        const wordDisplay = document.getElementById('word-display');
        const specScreen = document.getElementById('spectator-screen');
        const playArea = document.getElementById('play-area');
        const oppLiveText = document.getElementById('opp-live-text');
        
        const wordList = ["FAT", "JUDE", "MAX", "CHRIS"];
        let currentWord = "", startTime, interval, active = false, mode = 'solo';
        let scores = { me: 0, opp: 0, target: 5 };
        let peer, conn, isHost = false;

        function toggle(id) {
            const p = document.getElementById(id);
            p.style.display = p.style.display === 'block' ? 'none' : 'block';
        }

        peer = new Peer();
        peer.on('open', (id) => { document.getElementById('my-id-box').value = id; });
        
        document.getElementById('connect-btn').onclick = () => {
            const id = document.getElementById('join-id-box').value;
            if(id) { conn = peer.connect(id); initSocket(); }
        };

        peer.on('connection', (c) => { 
            conn = c; isHost = true; 
            document.getElementById('id-section').style.display = 'none';
            document.getElementById('setup-screen').style.display = 'flex';
            document.getElementById('multi-panel').style.display = 'block';
            initSocket(); 
        });

        function setTarget(num) {
            scores.target = num;
            conn.send({type: 'SET_GOAL', goal: num});
            document.getElementById('multi-panel').style.display = 'none';
            document.getElementById('scoreboard-ui').style.display = 'flex';
            document.getElementById('target-txt').innerText = "FIRST TO " + num;
            startRound();
        }

        function initSocket() {
            conn.on('data', (d) => {
                if(d.type === 'SET_GOAL') {
                    scores.target = d.goal;
                    document.getElementById('multi-panel').style.display = 'none';
                    document.getElementById('scoreboard-ui').style.display = 'flex';
                    document.getElementById('target-txt').innerText = "FIRST TO " + d.goal;
                }
                if(d.type === 'START_MY_TURN') {
                    specScreen.style.display = "none"; playArea.style.display = "block";
                    currentWord = d.w; wordDisplay.innerText = d.w;
                    input.disabled = false; input.value = ""; input.focus();
                }
                if(d.type === 'SPECTATE') {
                    playArea.style.display = "none"; specScreen.style.display = "block";
                    oppLiveText.innerText = d.val;
                }
                if(d.type === 'RESULT') {
                    scores.me = d.s1; scores.opp = d.s2;
                    document.getElementById('my-score').innerText = scores.me;
                    document.getElementById('opp-score').innerText = scores.opp;
                    pop(d.msg);
                    checkWinner();
                }
                if(d.type === 'GUEST_FINISH' && isHost) {
                    scores.opp++;
                    updateScores("OPPONENT POINT!");
                    if(!checkWinner()) setTimeout(startRound, 2000);
                }
            });
        }

        function startRound() {
            const w = wordList[Math.floor(Math.random()*wordList.length)];
            const p1Goes = (scores.me + scores.opp) % 2 === 0;
            if(p1Goes) { setupMyTurn(w); conn.send({type: 'SPECTATE', val: ""}); } 
            else { conn.send({type: 'START_MY_TURN', w: w}); setupSpectatorMode(); }
        }

        function setupMyTurn(w) {
            specScreen.style.display = "none"; playArea.style.display = "block";
            currentWord = w; wordDisplay.innerText = w;
            input.disabled = false; input.value = ""; input.focus();
        }

        function setupSpectatorMode() {
            playArea.style.display = "none"; specScreen.style.display = "block"; oppLiveText.innerText = "";
        }

        input.addEventListener('input', () => {
            const val = input.value.toUpperCase();
            if(conn) conn.send({type: 'SPECTATE', val: val});
            if (!active && val.length > 0) {
                active = true; startTime = performance.now();
                interval = setInterval(() => { timerText.innerText = ((performance.now()-startTime)/1000).toFixed(3)+"s"; }, 10);
            }
            if (val === currentWord) {
                clearInterval(interval); active = false; input.disabled = true;
                if (isHost) {
                    scores.me++; updateScores("YOU POINT!");
                    if(!checkWinner()) setTimeout(startRound, 2000);
                } else {
                    conn.send({type: 'GUEST_FINISH'});
                }
            }
        });

        function updateScores(msg) {
            conn.send({type: 'RESULT', s1: scores.opp, s2: scores.me, msg: msg});
            document.getElementById('my-score').innerText = scores.me;
            document.getElementById('opp-score').innerText = scores.opp;
            pop(msg);
        }

        function checkWinner() {
            let winMsg = "";
            if(scores.me >= scores.target) winMsg = "YOU WON THE MATCH!";
            if(scores.opp >= scores.target) winMsg = "OPPONENT WON THE MATCH!";
            
            if(winMsg) {
                wordDisplay.innerText = "GG!";
                pop(winMsg);
                input.disabled = true;
                return true;
            }
            return false;
        }

        function pop(m) {
            document.getElementById('p-name').innerText = m;
            document.getElementById('adv-popup').classList.add('show');
            setTimeout(() => document.getElementById('adv-popup').classList.remove('show'), 2000);
        }
    </script>
</body>
</html>
